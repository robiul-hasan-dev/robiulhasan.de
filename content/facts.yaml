# =============================================================================
# TRUTH REGISTRY — robiulhasan.de
# Master Implementation Directive §1.2 (Truth protocol).
#
# Every public claim on the site MUST have an entry here. Nothing is published
# from memory or invention — the site renders `publicWording`, and only when
# `status` permits.
#
# status:
#   verified          — checked against primary evidence; publishable
#   owner-confirmed    — Robiul confirmed in writing; publishable
#   needs-verification — NOT publishable; publicWording MUST be null
#   private            — real but must never be exposed; publicWording MUST be null
#
# lifecycle (for project claims): concept | prototype | in-progress |
#                                 field-experience | production
#
# HARD RULES (enforced by lib/schema.ts in a later slice):
#   - needs-verification / private  => publicWording: null
#   - verified / owner-confirmed     => publicWording + evidence + lastVerified required
#   - Never publish: unsupported metrics, "100% DSGVO", "AI intelligence",
#     awards, client logos, testimonials, employer endorsements, revenue,
#     user counts, or "production" without verification (directive §1.2, §10).
#   - Missing owner data => "OWNER INPUT REQUIRED"; never invent values.
#
# Dates are ISO 8601 (YYYY-MM-DD).
# =============================================================================
